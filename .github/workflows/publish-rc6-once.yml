name: Publish Tailnet TV RC6 package assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-rc6-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified package artifact
        env:
          ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ec78-8210-929c-2779a29fa6c8/raw?se=2026-10-03T16%3A28%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=ae839212-a284-5ca7-95cc-02f6edd076d7&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T05%3A26%3A59Z&ske=2026-10-04T05%3A26%3A59Z&sks=b&skv=2026-02-06&sig=sbvD1lV7IzkYa0AIGGsV9HM8cWMogZP2A0ECRPj0sdk%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/tailnettv-packages.zip
          mkdir -p /tmp/tailnettv-packages
          unzip -q /tmp/tailnettv-packages.zip -d /tmp/tailnettv-packages

          echo "04e27f2ae08335b48ce10072fea8f09c73357150179f5f031af3e6ef42e79204  /tmp/tailnettv-packages/legacy/dev.tailnettv.app_0.3.0_legacy.ipk" | sha256sum -c -
          echo "752c57f6b959866c9ca3c66f4103931c2c21f2e03acd279137ae5ff4c701a796  /tmp/tailnettv-packages/modern/dev.tailnettv.app_0.3.0_modern.ipk" | sha256sum -c -

          printf '%s  %s\n' "04e27f2ae08335b48ce10072fea8f09c73357150179f5f031af3e6ef42e79204" "dev.tailnettv.app_0.3.0_legacy.ipk" > /tmp/tailnettv-packages/legacy/dev.tailnettv.app_0.3.0_legacy.ipk.sha256
          printf '%s  %s\n' "752c57f6b959866c9ca3c66f4103931c2c21f2e03acd279137ae5ff4c701a796" "dev.tailnettv.app_0.3.0_modern.ipk" > /tmp/tailnettv-packages/modern/dev.tailnettv.app_0.3.0_modern.ipk.sha256

      - name: Publish RC6 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="0.3.0-rc.6"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Tailnet TV 0.3.0 RC6" \
              --notes "RC6 hardware-validation candidate. Contains separate modern and legacy webOS packages generated and verified by tailscaleWebOS CI. Test on physical TVs before promotion."
          fi

          gh release upload "$tag" \
            /tmp/tailnettv-packages/legacy/dev.tailnettv.app_0.3.0_legacy.ipk \
            /tmp/tailnettv-packages/legacy/dev.tailnettv.app_0.3.0_legacy.ipk.sha256 \
            /tmp/tailnettv-packages/modern/dev.tailnettv.app_0.3.0_modern.ipk \
            /tmp/tailnettv-packages/modern/dev.tailnettv.app_0.3.0_modern.ipk.sha256 \
            --clobber
