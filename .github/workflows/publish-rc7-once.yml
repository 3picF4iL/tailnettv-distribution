name: Publish Tailnet TV RC7 package assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-rc7-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified package artifact
        env:
          ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0a68-8210-84f4-112282591db3/raw?se=2026-10-03T17%3A59%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=76ef26b7-2400-5ca1-9fab-67a26665b6b4&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T06%3A40%3A14Z&ske=2026-10-04T06%3A40%3A14Z&sks=b&skv=2026-02-06&sig=dcsnEP5iubTbe5ijLqVuQmGXOYkfBrWm0rgVhgCanRE%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/tailnettv-packages.zip
          mkdir -p /tmp/tailnettv-packages
          unzip -q /tmp/tailnettv-packages.zip -d /tmp/tailnettv-packages

          echo "893ef92cea383eed698cdc2637888c4ff3cd80cf4791ebe12f92b3edfd7b38c8  /tmp/tailnettv-packages/legacy/dev.tailnettv.app_0.3.0_legacy.ipk" | sha256sum -c -
          echo "1b23f7d2e2ddba64cbf5736c74d635c17d7989b75c6b084490996ca5a27ece9e  /tmp/tailnettv-packages/modern/dev.tailnettv.app_0.3.0_modern.ipk" | sha256sum -c -

          printf '%s  %s\n' "893ef92cea383eed698cdc2637888c4ff3cd80cf4791ebe12f92b3edfd7b38c8" "dev.tailnettv.app_0.3.0_legacy.ipk" > /tmp/tailnettv-packages/legacy/dev.tailnettv.app_0.3.0_legacy.ipk.sha256
          printf '%s  %s\n' "1b23f7d2e2ddba64cbf5736c74d635c17d7989b75c6b084490996ca5a27ece9e" "dev.tailnettv.app_0.3.0_modern.ipk" > /tmp/tailnettv-packages/modern/dev.tailnettv.app_0.3.0_modern.ipk.sha256

      - name: Publish RC7 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="0.3.0-rc.7"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Tailnet TV 0.3.0 RC7" \
              --notes "RC7 legacy WebAppMgr compatibility candidate. Includes Chromium 53 legacy UI build, preparation flow fix, and helper recycle fix from merged PR #28."
          fi

          gh release upload "$tag" \
            /tmp/tailnettv-packages/legacy/dev.tailnettv.app_0.3.0_legacy.ipk \
            /tmp/tailnettv-packages/legacy/dev.tailnettv.app_0.3.0_legacy.ipk.sha256 \
            /tmp/tailnettv-packages/modern/dev.tailnettv.app_0.3.0_modern.ipk \
            /tmp/tailnettv-packages/modern/dev.tailnettv.app_0.3.0_modern.ipk.sha256 \
            --clobber
