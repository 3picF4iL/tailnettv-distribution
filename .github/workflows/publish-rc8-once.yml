name: Publish RC8 once

on:
  push:
    paths:
      - ".github/workflows/publish-rc8-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        env:
          ARTIFACT_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-bf08-8246-9ac8-c9d46c78aa27/raw?se=2026-10-03T19%3A24%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=73a6e8c7-a161-5808-ac41-3cc092b5dd27&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T07%3A18%3A10Z&ske=2026-10-04T07%3A18%3A10Z&sks=b&skv=2026-02-06&sig=ntKvXcR/viS3SvaeTTn9AmRunCAtb2RmbMXkXU7GNV4%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/rc8.zip
          mkdir -p /tmp/rc8
          unzip -q /tmp/rc8.zip -d /tmp/rc8

      - name: Verify package hashes
        run: |
          set -euo pipefail
          echo "7d047e585de0ff03bf94bc55aa201f802f243e6525d97241ba89a65a474e71de  /tmp/rc8/legacy/dev.tailnettv.app_0.3.0_legacy.ipk" | sha256sum -c -
          echo "73e542fc5334d8ec165c04e239d315d76e48f289e08d3f40ae263d7c72aa0025  /tmp/rc8/modern/dev.tailnettv.app_0.3.0_modern.ipk" | sha256sum -c -

      - name: Prepare release assets
        run: |
          set -euo pipefail
          cd /tmp/rc8/legacy
          sha256sum dev.tailnettv.app_0.3.0_legacy.ipk > dev.tailnettv.app_0.3.0_legacy.ipk.sha256
          cd /tmp/rc8/modern
          sha256sum dev.tailnettv.app_0.3.0_modern.ipk > dev.tailnettv.app_0.3.0_modern.ipk.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 0.3.0-rc.8 \
            --repo "${{ github.repository }}" \
            --title "Tailnet TV 0.3.0 RC8" \
            --notes "RC8 built from tailscaleWebOS release/0.3.0 merge commit b0419a18badb5556c83d0a1732785247fc6b7183. Includes helper auto-recovery after package updates and missing transient socket status handling." \
            --prerelease \
            /tmp/rc8/legacy/dev.tailnettv.app_0.3.0_legacy.ipk \
            /tmp/rc8/legacy/dev.tailnettv.app_0.3.0_legacy.ipk.sha256 \
            /tmp/rc8/modern/dev.tailnettv.app_0.3.0_modern.ipk \
            /tmp/rc8/modern/dev.tailnettv.app_0.3.0_modern.ipk.sha256
