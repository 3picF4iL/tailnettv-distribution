name: Publish RC9 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-rc9-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8fdc-8210-8f08-0815676a3fea/raw?se=2026-10-03T20%3A33%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=6747fa91-38ae-5701-9b3a-8969661ae468&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T04%3A49%3A58Z&ske=2026-10-04T04%3A49%3A58Z&sks=b&skv=2026-02-06&sig=oEHTC%2B01Lw1CP5bHLvzwxz3g/BnHA4DVWc4M5HQTqQQ%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/tailnettv-rc9-build.zip
          mkdir -p /tmp/rc9
          unzip -q /tmp/tailnettv-rc9-build.zip -d /tmp/rc9

      - name: Verify packages
        run: |
          set -euo pipefail
          echo "6642d168431f8e263612b7f35c1ecaaaf5da2a2c8e30b363c2fa8c97cd6f8ed9  /tmp/rc9/legacy/dev.tailnettv.app_0.3.0_legacy.ipk" | sha256sum -c -
          echo "4d2d5d75c9f0da806b458135d70419fbdc7237dbf2c089d2bd7879f8e6e2089f  /tmp/rc9/modern/dev.tailnettv.app_0.3.0_modern.ipk" | sha256sum -c -

      - name: Publish RC9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 0.3.0-rc.9 \
            /tmp/rc9/legacy/dev.tailnettv.app_0.3.0_legacy.ipk \
            /tmp/rc9/modern/dev.tailnettv.app_0.3.0_modern.ipk \
            --repo "${{ github.repository }}" \
            --title "Tailnet TV 0.3.0 RC9" \
            --notes "RC9 adds persisted subnet-route acceptance controls. Fresh Tailscale logins enable subnet routes by default; existing installs preserve their stored preference." \
            --prerelease
